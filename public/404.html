<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séance introuvable — Séance 404</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Jersey+10&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --paper: #f3ede1; --ink: #1a1820; --ink-2: #5d5862; --cream: #f6f0e4; --bleu: #2e4ea1; --jaune: #f4c430; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #17151b; --ink: #efe8da; --ink-2: #aaa39b; color-scheme: dark; }
  }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; background: var(--paper); color: var(--ink); font: 400 16px/1.5 'Archivo', Arial, sans-serif; }
  .ticket { display: flex; max-width: 560px; width: 100%; background: var(--bleu); color: var(--cream); }
  .stub { display: grid; place-items: center; width: 130px; flex: none; padding: 20px 0; border-right: 2px solid rgba(246, 240, 228, 0.55); text-align: center; }
  .stub small { display: block; font: 700 10px 'Archivo'; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; }
  .stub b { display: block; font: 400 64px/0.9 'Jersey 10', monospace; color: var(--jaune); }
  .main { padding: 22px 24px; }
  h1 { font: 900 38px/0.95 'Archivo'; font-stretch: 62%; text-transform: uppercase; }
  p { margin-top: 10px; font-size: 15px; }
  a { display: inline-block; margin-top: 16px; padding: 9px 16px 8px; background: var(--cream); color: #1a1820; font: 800 14px 'Archivo'; font-stretch: 75%; text-transform: uppercase; letter-spacing: 0.04em; text-decoration: none; }
  a:hover { background: #1a1820; color: var(--cream); }
</style>
</head>
<body>
  <div class="ticket">
    <div class="stub"><div><small>Séance</small><b>404</b></div></div>
    <div class="main">
      <h1>Cette séance n'existe pas</h1>
      <p>La page demandée n'est pas à l'affiche.</p>
      <a href="/">Retour aux salles</a>
    </div>
  </div>
</body>
</html>
