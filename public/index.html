<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Cercle des films disparus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  :root {
    --paper: #f3ede1;
    --paper-2: #e6dfd0;
    --ink: #1a1820;
    --ink-2: #5d5862;
    --ink-3: #9b958f;
    --rule: #cbc3b3;

    /* Encres d'imprimerie, en aplat */
    --vermillon: #ec4f2c;
    --rose: #f07fb0;
    --jaune: #f4c430;
    --vert: #1e8a5a;
    --sarcelle: #0e7a85;
    --bleu: #2e4ea1;
    --prune: #683e7c;

    --red: var(--vermillon);
    --sec: var(--vermillon);
    --font: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  }

  /* Chaque onglet a son encre, reprise par les boutons et les choix actifs */
  body[data-tab="hasard"] { --sec: var(--vermillon); }
  body[data-tab="gems"] { --sec: var(--vert); }
  body[data-tab="duel"] { --sec: var(--bleu); }

  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--sec); color: var(--paper); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .app { max-width: 1080px; margin: 0 auto; padding: 0 32px 40px; }

  /* Lettrage étroit des titres : même famille, largeur 62 % */
  .narrow { font-stretch: 62%; font-weight: 900; text-transform: uppercase; }

  /* ---------- Bandeau ---------- */
  .mast {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
    padding: 30px 0 14px;
    border-bottom: 4px solid var(--ink);
  }
  /* Léger décalage de calage, comme une impression à deux passages */
  .mast-title { font-size: 52px; line-height: 0.86; letter-spacing: -0.005em; text-shadow: 3px 2px 0 var(--rose); }

  .pseudo label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 2px; }
  .pseudo-row { display: flex; align-items: flex-end; gap: 10px; }
  .pseudo input {
    width: 210px;
    padding: 5px 0 4px;
    background: transparent;
    border: 0;
    border-bottom: 2px solid var(--ink);
    border-radius: 0;
    color: var(--ink);
    font: 500 17px var(--font);
    outline: none;
  }
  .pseudo input:focus { border-color: var(--red); }
  .pseudo.flash input { animation: flash 0.7s; }
  @keyframes flash { 0%, 60% { border-color: var(--red); background: rgba(236, 79, 44, 0.08); } }
  .pseudo-error { margin-top: 6px; max-width: 280px; font-size: 13px; color: var(--red); }

  /* Carte de membre du Cercle */
  .member { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .member-card {
    display: grid;
    grid-template-columns: auto auto;
    gap: 2px 18px;
    align-items: baseline;
    padding: 10px 14px 11px;
    background: var(--jaune);
    border: 2px solid var(--ink);
    transform: rotate(1.5deg);
  }
  .member-label { grid-column: 1 / -1; font: 700 11px var(--font); text-transform: uppercase; letter-spacing: 0.08em; }
  .member-name { font: 900 24px/1 var(--font); font-stretch: 62%; }
  .member-num { font: 700 14px var(--font); font-stretch: 75%; font-variant-numeric: tabular-nums; }
  .member-stats { font-size: 13px; color: var(--ink-2); }

  /* ---------- Onglets ---------- */
  .tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--ink); }
  .tab {
    padding: 11px 16px 10px;
    background: none;
    border: 0;
    color: var(--ink);
    font: 700 15px var(--font);
    font-stretch: 85%;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  .tab::before {
    content: '';
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 8px;
    background: var(--c);
  }
  .tab:hover { background: var(--paper-2); }
  .tab[aria-selected="true"] { background: var(--c); color: var(--paper); }
  .tab[aria-selected="true"]::before { background: var(--paper); }
  .tab-n { margin-left: 7px; font-weight: 400; opacity: 0.65; text-transform: none; }

  /* ---------- Boutons et liens ---------- */
  .btn {
    padding: 13px 22px 12px;
    background: var(--sec);
    color: var(--paper);
    border: 0;
    border-radius: 0;
    font: 800 15px var(--font);
    font-stretch: 75%;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    cursor: pointer;
  }
  .btn:hover { background: var(--ink); }
  .btn:disabled { background: var(--ink-3); cursor: wait; }
  .btn-sm { padding: 7px 13px 6px; font-size: 13px; }
  .link {
    padding: 0;
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .link:hover { color: var(--red); }

  /* ---------- Bloc d'introduction de chaque onglet ---------- */
  .intro {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    padding: 18px 0;
    border-bottom: 1px solid var(--rule);
  }
  .intro p { max-width: 62ch; color: var(--ink-2); }
  .intro strong { color: var(--ink); font-weight: 600; }

  /* Choix en texte, séparés par des barres obliques */
  .opts { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; padding: 14px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .opts-group { display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px; }
  .opts-label { color: var(--ink-2); margin-right: 3px; }
  .opts-sep { color: var(--ink-3); }
  .opt {
    padding: 0;
    background: none;
    border: 0;
    color: var(--ink-2);
    font: inherit;
    cursor: pointer;
  }
  .opt:hover { color: var(--red); }
  .opt[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 700;
    text-decoration: underline;
    text-decoration-color: var(--sec);
    text-decoration-thickness: 3px;
    text-underline-offset: 5px;
  }
  .opt[aria-disabled="true"] { color: var(--ink-3); cursor: not-allowed; }
  .opts-note { color: var(--ink-2); font-size: 14px; }

  /* ---------- Film tiré ---------- */
  .film { padding-top: 26px; }

  /* Le film est imprimé sur un aplat de sa couleur. Encres claires : texte foncé */
  .film-head { padding: 22px 30px 26px; background: var(--c); color: var(--paper); transition: background 0.08s; }
  .film-head.light, .side.light { color: var(--ink); }
  .stamp {
    display: inline-block;
    padding: 4px 10px 3px;
    border: 2px solid currentColor;
    font: 800 15px var(--font);
    font-stretch: 75%;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    transform: rotate(-4deg);
  }
  .film-title {
    margin-top: 14px;
    font-size: clamp(48px, 9vw, 112px);
    line-height: 0.86;
    letter-spacing: -0.012em;
    overflow-wrap: anywhere;
    text-wrap: balance;
  }
  .film.flicker .film-rest { opacity: 0.25; }
  .film-rest { transition: opacity 0.2s; }
  .film-meta { margin-top: 16px; font-size: 18px; font-weight: 500; }

  .facts {
    display: grid;
    grid-template-columns: auto auto 1fr;
    border-bottom: 1px solid var(--ink);
  }
  .facts > div { padding: 10px 26px 12px 0; }
  .facts > div + div { padding-left: 18px; border-left: 1px solid var(--rule); }
  .facts dt { font-size: 13px; color: var(--ink-2); }
  .facts dd { font: 700 32px/1.1 var(--font); font-stretch: 75%; font-variant-numeric: tabular-nums; }
  .facts dd span { margin-left: 2px; font-weight: 400; font-size: 17px; color: var(--ink-2); }
  .facts dd.text { padding-top: 6px; font: 500 16px/1.35 var(--font); }
  .facts dd.wait { color: var(--ink-3); }

  .film-cols { display: grid; grid-template-columns: 1.45fr 1fr; }
  .synopsis { max-width: 60ch; padding: 18px 30px 22px 0; font-size: 16.5px; line-height: 1.6; }
  .synopsis:empty { display: none; }
  .watch { padding: 18px 0 22px 24px; border-left: 1px solid var(--rule); }
  .watch-title { margin-bottom: 6px; font: 700 13px var(--font); text-transform: uppercase; letter-spacing: 0.06em; }
  .watch-none { margin-bottom: 4px; font-size: 14px; color: var(--ink-2); }

  /* Points de conduite, comme sur un programme */
  .leaders { list-style: none; }
  .leaders a { display: flex; align-items: baseline; gap: 6px; padding: 4px 0; color: inherit; text-decoration: none; }
  .leaders .dots { flex: 1; min-width: 16px; border-bottom: 1px dotted var(--ink-3); transform: translateY(-5px); }
  .leaders .what { font-size: 14px; color: var(--ink-2); white-space: nowrap; }
  .leaders .found .name { font-weight: 700; color: var(--sec); }
  .leaders a:hover .name { color: var(--sec); text-decoration: underline; text-underline-offset: 3px; }

  .history { padding: 12px 0; border-top: 1px solid var(--ink); font-size: 14px; color: var(--ink-2); }
  .history .link { color: var(--ink-2); }
  .history .link.current { color: var(--sec); font-weight: 700; text-decoration: none; }

  .blank { padding: 22px 0; border-bottom: 1px solid var(--rule); color: var(--ink-2); }
  .blank.error { color: var(--red); }

  /* ---------- Duel ---------- */
  .duel-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px 28px;
    flex-wrap: wrap;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
  }
  .duel-top .opts { padding: 0; border: 0; }
  .score { display: flex; gap: 26px; align-items: baseline; }
  .score div { display: flex; align-items: baseline; gap: 8px; }
  .score dt { font-size: 14px; color: var(--ink-2); }
  .score dd { font: 800 30px/1 var(--font); font-stretch: 70%; font-variant-numeric: tabular-nums; }
  .score #streak { color: var(--sec); }
  .score dd.up { color: var(--vermillon); }

  .duel-q { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 20px; flex-wrap: wrap; padding: 22px 0 14px; }
  .duel-q h2 { font: 700 24px/1.15 var(--font); font-stretch: 85%; }
  .duel-q p { font-size: 15px; color: var(--ink-2); }

  .arena { position: relative; display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); }
  .side {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 290px;
    padding: 24px 26px 22px;
    background: var(--c);
    color: var(--paper);
    border: 0;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, box-shadow 0.12s;
  }
  .side:last-child { border-left: 2px solid var(--ink); }
  .side:hover { box-shadow: inset 0 0 0 5px var(--ink); }
  .side-title {
    font-size: clamp(30px, 5.2vw, 62px);
    line-height: 0.88;
    overflow-wrap: anywhere;
    text-wrap: balance;
  }
  .side-year { margin-top: 10px; font-size: 16px; font-weight: 500; }
  .side-result { margin-top: auto; padding-top: 22px; visibility: hidden; }
  .side-result .n { font: 800 34px/1 var(--font); font-stretch: 70%; font-variant-numeric: tabular-nums; }
  .side-result .unit { margin-left: 6px; font-size: 15px; }

  /* Tampons posés après le vote */
  .side .stamp { position: absolute; right: 18px; bottom: 20px; visibility: hidden; }
  .side .stamp-pick { top: 18px; bottom: auto; transform: rotate(3deg); }

  .arena.revealed .side { cursor: default; }
  .arena.revealed .side:hover { box-shadow: none; }
  .arena.revealed .side-result { visibility: visible; }
  .arena.revealed .side.win .stamp-win { visibility: visible; }
  .arena.revealed .side.picked .stamp-pick { visibility: visible; }
  .arena.revealed .side.lose { background: var(--paper-2); color: var(--ink-3); }
  .arena.revealed .side.wrong .stamp-pick { color: var(--vermillon); }

  .or {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 1;
    transform: translate(-50%, -50%) rotate(-3deg);
    padding: 6px 10px 5px;
    background: var(--ink);
    color: var(--paper);
    font: 800 14px var(--font);
    font-stretch: 75%;
    text-transform: uppercase;
  }

  .duel-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; min-height: 86px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
  .verdict { font-size: 17px; max-width: 60ch; }
  .verdict strong { margin-right: 8px; font: 900 28px/1 var(--font); font-stretch: 62%; text-transform: uppercase; }
  .verdict.ko strong { color: var(--red); }
  .duel-level { padding-top: 12px; font-size: 14px; color: var(--ink-2); }

  /* ---------- Mobile ---------- */
  @media (max-width: 720px) {
    .app { padding: 0 18px 32px; }
    .mast-title { font-size: 42px; }
    .mast > div:last-child, .pseudo-row, .pseudo input { width: 100%; }
    .tab { padding: 10px 11px 9px; font-size: 14px; }
    .intro .btn { width: 100%; }
    .facts { grid-template-columns: 1fr 1fr; }
    .facts > div:nth-child(3) { grid-column: 1 / -1; padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); }
    .film-cols { grid-template-columns: 1fr; }
    .synopsis { padding-right: 0; }
    .watch { padding: 16px 0 20px; border-left: 0; border-top: 1px solid var(--rule); }
    .film-head { padding: 18px 18px 22px; }
    .member { align-items: flex-start; }
    .side { min-height: 240px; padding: 16px 14px 14px; }
    .side .stamp { right: 10px; bottom: 12px; font-size: 11px; padding: 3px 7px 2px; }
    .side .stamp-pick { top: auto; bottom: 46px; }
    .side-result .n { font-size: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-tab="hasard">
<div class="app">

  <header class="mast">
    <div>
      <h1 class="mast-title narrow">Le Cercle des films disparus</h1>
    </div>
    <div>
      <form class="pseudo" id="pseudoForm" autocomplete="off">
        <label for="pseudoInput">Pseudo Letterboxd</label>
        <div class="pseudo-row">
          <input id="pseudoInput" spellcheck="false">
          <button class="btn btn-sm" id="pseudoBtn" type="submit">OK</button>
        </div>
        <p class="pseudo-error" id="pseudoError" hidden></p>
      </form>
      <div class="member" id="who" hidden>
        <div class="member-card">
          <span class="member-label">Carte de membre</span>
          <strong class="member-name" id="whoName"></strong>
          <span class="member-num" id="whoNum"></span>
        </div>
        <p class="member-stats"><span id="whoStats"></span> — <button class="link" id="changeUser" type="button">changer</button></p>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="hasard" aria-selected="true" style="--c: var(--vermillon)">Au hasard<span class="tab-n" id="nHasard"></span></button>
    <button class="tab" role="tab" data-tab="gems" aria-selected="false" style="--c: var(--vert)">Bons films peu connus<span class="tab-n" id="nGems"></span></button>
    <button class="tab" role="tab" data-tab="duel" aria-selected="false" style="--c: var(--bleu)">Duel<span class="tab-n" id="nDuel"></span></button>
  </nav>

  <main>
    <section id="view-hasard">
      <div class="intro" id="hasardIntro">
        <p id="hasardText"></p>
        <button class="btn" id="drawHasard" type="button">Tirer un film</button>
      </div>
      <div id="stageHasard"></div>
      <p class="history" id="histHasard" hidden></p>
    </section>

    <section id="view-gems" hidden>
      <div class="intro">
        <p id="gemsText"></p>
        <button class="btn" id="drawGems" type="button">Tirer un film</button>
      </div>
      <div class="opts">
        <div class="opts-group" id="optRating">
          <span class="opts-label">Note</span>
          <button class="opt" data-v="all" aria-pressed="true">toutes</button><span class="opts-sep">/</span>
          <button class="opt" data-v="3.5" aria-pressed="false">3,5 et plus</button><span class="opts-sep">/</span>
          <button class="opt" data-v="4" aria-pressed="false">4 et plus</button>
        </div>
        <div class="opts-group" id="optLength">
          <span class="opts-label">Durée</span>
          <button class="opt" data-v="all" aria-pressed="true">tout</button><span class="opts-sep">/</span>
          <button class="opt" data-v="short" aria-pressed="false">courts métrages</button><span class="opts-sep">/</span>
          <button class="opt" data-v="long" aria-pressed="false">longs métrages</button>
        </div>
        <p class="opts-note" id="seenNote" hidden></p>
      </div>
      <div id="stageGems"></div>
      <p class="history" id="histGems" hidden></p>
    </section>

    <section id="view-duel" hidden>
      <div class="duel-top">
        <div class="opts">
          <div class="opts-group" id="optSource">
            <span class="opts-label">Films</span>
            <button class="opt" data-v="popular" aria-pressed="true">populaires</button><span class="opts-sep">/</span>
            <button class="opt" data-v="seen" aria-pressed="false">que j'ai vus</button><span class="opts-sep">/</span>
            <button class="opt" data-v="watchlist" aria-pressed="false">de ma watchlist</button>
          </div>
        </div>
        <dl class="score">
          <div><dt>Série</dt><dd id="streak">0</dd></div>
          <div><dt>Record</dt><dd id="best">0</dd></div>
        </dl>
      </div>

      <p class="blank" id="duelStatus" hidden></p>
      <div id="duelGame" hidden>
        <div class="duel-q">
          <h2>Lequel a le plus de notes ?</h2>
          <p id="tier"></p>
        </div>
        <div class="arena" id="arena"></div>
        <div class="duel-foot">
          <p class="verdict" id="verdict" aria-live="polite"></p>
          <button class="btn" id="nextDuel" type="button" hidden>Duel suivant</button>
        </div>
        <p class="duel-level" id="levelText"></p>
      </div>
    </section>
  </main>
</div>

<script>
const TMDB_KEY = '8265bd1679663a7ea12ac168da84d2e8';
const TMDB = 'https://api.themoviedb.org/3';

// En local, le serveur Express sert aussi cette page : on reste sur la même origine.
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? '' : 'https://random-movie-v6j8.onrender.com';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const nf = new Intl.NumberFormat('fr-FR');
// Archivo n'a pas l'espace fine du format français : espace insécable classique à la place.
const num = n => nf.format(n).replace(/ /g, ' ');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function hash(str) {
  let h = 0;
  for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h;
}

const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

// Encres d'impression : chaque film reçoit toujours la même, d'après son identifiant.
// Sur les encres claires, le texte est imprimé en foncé.
const PALETTE = [
  { c: 'var(--vermillon)', light: false },
  { c: 'var(--rose)', light: true },
  { c: 'var(--jaune)', light: true },
  { c: 'var(--vert)', light: false },
  { c: 'var(--sarcelle)', light: false },
  { c: 'var(--bleu)', light: false },
  { c: 'var(--prune)', light: false },
];
const inkIndex = slug => hash(slug) % PALETTE.length;

function paint(node, ink) {
  node.style.setProperty('--c', ink.c);
  node.classList.toggle('light', ink.light);
}

const fmtRating = r => r.toFixed(2).replace('.', ',');
const pad = n => String(n).padStart(2, '0');
const isShort = f => f.runtime && f.runtime <= 40;
function fmtRuntime(m) {
  if (!m) return '';
  return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + pad(m % 60);
}

const state = {
  user: null,
  watchlist: [],
  tab: 'hasard',
  hist: { hasard: [], gems: [] },
  current: { hasard: null, gems: null },
  counter: 0,
  gemRating: 'all',
  gemLength: 'all',
  seenSkipped: 0,
  drawing: false,
};
let gems = null;
const detailCache = new Map();
const seenCache = new Map();

// ---------- Profil ----------
$('pseudoForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('pseudoInput').value.trim().replace(/^@/, '');
  if (v) connect(v);
});

async function connect(pseudo) {
  const btn = $('pseudoBtn');
  btn.disabled = true;
  btn.textContent = '…';
  $('pseudoError').hidden = true;
  if (state.tab === 'hasard') $('stageHasard').replaceChildren(el('p', 'blank', 'Chargement de la watchlist…'));

  try {
    const resp = await fetch(`${API_BASE}/api/watchlist/${encodeURIComponent(pseudo)}`);
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      pseudoError(data.error || 'Profil introuvable.');
      return;
    }

    state.user = pseudo;
    state.watchlist = data.films || [];
    state.current.hasard = null;
    state.hist.hasard = [];
    state.seenSkipped = 0;
    duel.seen = null;
    renderProfile();
    refresh();
    if (state.tab === 'hasard' && state.watchlist.length) draw('hasard');
  } catch (e) {
    pseudoError('Serveur injoignable.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'OK';
    if (!state.user) refresh();
  }
}

// ---------- Tirage (watchlist et bons films peu connus) ----------
$('drawHasard').addEventListener('click', () => draw('hasard'));
$('drawGems').addEventListener('click', () => draw('gems'));

async function loadGems() {
  if (!gems) {
    const resp = await fetch('gems.json');
    if (!resp.ok) throw new Error('gems.json introuvable');
    gems = await resp.json();
    refresh();
  }
  return gems;
}

function gemPool(list) {
  return list
    .filter(g => state.gemRating === 'all' || g.rating >= Number(state.gemRating))
    .filter(g => state.gemLength === 'all' || (state.gemLength === 'short' ? isShort(g) : !isShort(g)));
}

// Tire un film en évitant les derniers sortis. Pondéré par la note pour les
// films peu connus : un film à 4/5 sort 9 fois plus souvent qu'un film à 3/5.
function pickFrom(pool, hist, weighted) {
  const avoid = new Set(hist.slice(-Math.min(5, pool.length - 1)).map(h => h.film.slug));
  let cands = pool.filter(f => !avoid.has(f.slug));
  if (!cands.length) cands = pool;
  if (!weighted) return cands[Math.floor(Math.random() * cands.length)];

  const w = cands.map(g => Math.pow(3, (g.rating - 3) * 2));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cands.length; i++) {
    r -= w[i];
    if (r <= 0) return cands[i];
  }
  return cands[cands.length - 1];
}

const seenKey = (user, slug) => user.toLowerCase() + '|' + slug;

async function hasSeen(user, slug) {
  const key = seenKey(user, slug);
  if (seenCache.has(key)) return { seen: seenCache.get(key) };
  try {
    const resp = await fetch(`${API_BASE}/api/has-seen/${encodeURIComponent(user)}/${encodeURIComponent(slug)}`);
    const data = await resp.json().catch(() => ({}));
    if (resp.status === 404) return { notFound: true, error: data.error || 'Profil introuvable.' };
    if (!resp.ok) return { seen: false };
    seenCache.set(key, data.seen);
    return { seen: data.seen };
  } catch (e) {
    return { seen: false };
  }
}

// Avec un pseudo, chaque film tiré est vérifié auprès de Letterboxd. On
// abandonne après quelques films déjà vus plutôt que de faire attendre.
async function pickGem(pool) {
  const user = state.user;
  for (let tries = 0; tries < 8; tries++) {
    const cands = user ? pool.filter(g => seenCache.get(seenKey(user, g.slug)) !== true) : pool;
    if (!cands.length) break;

    const gem = pickFrom(cands, state.hist.gems, true);
    if (!user) return gem;

    const check = await hasSeen(user, gem.slug);
    if (check.notFound) {
      $('stageGems').replaceChildren(el('p', 'blank error', check.error));
      return null;
    }
    if (!check.seen) return gem;

    state.seenSkipped++;
    refresh();
  }
  $('stageGems').replaceChildren(el('p', 'blank', 'Les derniers films tirés sont déjà vus.'));
  return null;
}

// Les titres et les encres défilent tant que le tirage n'est pas fini, et au
// moins huit fois.
function flicker(block, pool) {
  block.classList.add('flicker');
  const head = block.querySelector('.film-head');
  const title = block.querySelector('.film-title');
  let running = true;
  let frames = 0;
  const done = (async () => {
    while (running || frames < 8) {
      const other = pool[Math.floor(Math.random() * pool.length)];
      title.textContent = other.name;
      paint(head, PALETTE[(inkIndex(other.slug) + frames) % PALETTE.length]);
      frames++;
      await sleep(50 + Math.min(frames, 8) * 9);
    }
  })();
  return () => {
    running = false;
    return done;
  };
}

async function draw(kind) {
  if (state.drawing) return;
  if (kind === 'hasard' && !state.user) return askPseudo();
  if (kind === 'hasard' && !state.watchlist.length) return;

  const stage = kind === 'gems' ? $('stageGems') : $('stageHasard');
  state.drawing = true;
  let stop = null;

  try {
    const pool = kind === 'gems' ? gemPool(await loadGems()) : state.watchlist;
    if (!pool.length) {
      stage.replaceChildren(el('p', 'blank', 'Aucun film avec ces filtres.'));
      return;
    }

    const shown = stage.querySelector('.film');
    if (shown && !reduced) stop = flicker(shown, pool);

    const film = kind === 'gems' ? await pickGem(pool) : pickFrom(pool, state.hist.hasard, false);
    if (!film) return;

    // Les détails se chargent pendant que les titres défilent
    getDetails(film, kind === 'gems');
    if (stop) await stop();

    const entry = { film, n: ++state.counter };
    state.hist[kind].push(entry);
    if (state.hist[kind].length > 8) state.hist[kind].shift();
    show(kind, entry);
  } catch (e) {
    stage.replaceChildren(el('p', 'blank error', kind === 'gems' ? 'Sélection indisponible.' : 'Tirage impossible.'));
  } finally {
    if (stop) await stop();
    state.drawing = false;
  }
}

function show(kind, entry) {
  state.current[kind] = entry;
  const stage = kind === 'gems' ? $('stageGems') : $('stageHasard');
  stage.replaceChildren(filmBlock(entry));
  renderHistory(kind);

  if (entry.d) return;
  getDetails(entry.film, kind === 'gems').then(d => {
    entry.d = d;
    if (state.current[kind] === entry) stage.replaceChildren(filmBlock(entry));
  });
}

// ---------- Détails d'un film : Letterboxd, puis TMDB ----------
function getDetails(film, withArchive) {
  if (!detailCache.has(film.slug)) {
    const pending = loadDetails(film, withArchive);
    detailCache.set(film.slug, pending);

    // Fiche incomplète à cause du réseau : on retentera au prochain tirage
    pending.then(d => {
      if (d.partial) detailCache.delete(film.slug);
    });
  }
  return detailCache.get(film.slug);
}

async function loadDetails(film, withArchive) {
  // Note, nombre de notes, durée, réalisation et identifiant TMDB viennent de
  // la page Letterboxd. Les films peu connus les ont déjà dans gems.json.
  let lb = null;
  if (film.ratingCount == null) {
    try {
      const resp = await fetch(`${API_BASE}/api/film/${encodeURIComponent(film.slug)}`);
      if (resp.ok) lb = await resp.json();
    } catch (e) {
      // serveur injoignable : on se rabat sur TMDB
    }
  }
  const base = { ...film, ...(lb || {}) };
  if (!base.name) base.name = film.name;
  if (!base.year) base.year = film.year;

  const isMovie = base.type !== 'tv';
  const tmdbId = base.tmdbId || (isMovie ? await searchTmdb(base) : null);
  const [t, archive] = await Promise.all([
    tmdbId ? tmdbMovie(tmdbId) : null,
    withArchive ? archiveCopy(base) : null,
  ]);
  const crew = t && t.credits ? t.credits.crew.filter(c => c.job === 'Director').map(c => c.name) : [];

  return {
    name: base.name,
    year: base.year,
    rating: base.rating ?? null,
    ratingCount: base.ratingCount ?? null,
    runtime: base.runtime || (t && t.runtime) || null,
    directors: base.directors && base.directors.length ? base.directors : crew,
    genres: t ? (t.genres || []).map(g => g.name).slice(0, 3) : [],
    overview: t ? t.overview || '' : '',
    watch: t ? watchOf(t) : null,
    tmdbId: tmdbId || null,
    archive,
    partial: Boolean(tmdbId && !t) || (film.ratingCount == null && !lb),
  };
}

// Recherche de secours. Le premier résultat n'est pas toujours le bon film
// (« Men » renvoie « Repo Men ») : titre identique et année à un an près.
async function searchTmdb(film) {
  try {
    const url = `${TMDB}/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(film.name)}` + (film.year ? `&year=${film.year}` : '');
    const resp = await fetch(url);
    if (!resp.ok) return null;
    const hit = ((await resp.json()).results || []).find(r =>
      (norm(r.title) === norm(film.name) || norm(r.original_title) === norm(film.name))
      && (!film.year || Math.abs(parseInt((r.release_date || '0').slice(0, 4), 10) - film.year) <= 1));
    return hit ? hit.id : null;
  } catch (e) {
    return null;
  }
}

// Deux essais : une coupure réseau passagère ne doit pas vider la fiche.
async function tmdbMovie(id) {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const resp = await fetch(`${TMDB}/movie/${id}?api_key=${TMDB_KEY}&language=fr-FR&append_to_response=credits,watch/providers`);
      if (!resp.ok) return null;
      const t = await resp.json();

      // Pas de synopsis en français : on prend l'anglais
      if (!t.overview) {
        const en = await fetch(`${TMDB}/movie/${id}?api_key=${TMDB_KEY}&language=en-US`);
        if (en.ok) t.overview = (await en.json()).overview || '';
      }
      return t;
    } catch (e) {
      await sleep(700);
    }
  }
  return null;
}

// Offres légales connues de TMDB (données JustWatch), Belgique puis France.
function watchOf(t) {
  const results = (t['watch/providers'] && t['watch/providers'].results) || {};
  for (const country of ['BE', 'FR']) {
    const r = results[country];
    if (!r) continue;
    const names = list => [...new Set(list.map(p => p.provider_name))].slice(0, 3);
    const stream = names([...(r.flatrate || []), ...(r.free || []), ...(r.ads || [])]);
    const rent = names([...(r.rent || []), ...(r.buy || [])]);
    if (stream.length || rent.length) return { country, stream, rent, link: r.link };
  }
  return null;
}

// Internet Archive héberge aussi des copies non autorisées : on ne garde qu'un
// dépôt qui déclare une licence (domaine public ou Creative Commons), avec le
// même titre et la même année que le film.
async function archiveCopy(film) {
  if (!film.year) return null;
  const q = `title:("${film.name.replace(/"/g, '')}") AND mediatype:(movies) AND licenseurl:*`;
  try {
    const resp = await fetch('https://archive.org/advancedsearch.php?q=' + encodeURIComponent(q)
      + '&fl[]=identifier&fl[]=title&fl[]=year&rows=20&output=json');
    if (!resp.ok) return null;
    const docs = (await resp.json()).response.docs || [];
    const hit = docs.find(d => norm(d.title) === norm(film.name) && Math.abs(parseInt(d.year, 10) - film.year) <= 1);
    return hit ? 'https://archive.org/details/' + hit.identifier : null;
  } catch (e) {
    return null;
  }
}

// ---------- Fiche d'un film tiré ----------
function filmBlock(entry) {
  const f = entry.film;
  const d = entry.d || {};
  const loaded = Boolean(entry.d);
  const box = el('article', 'film');

  // Aplat de couleur : numéro de tirage, titre, année, durée, réalisation
  const runtime = d.runtime || f.runtime;
  const directors = (d.directors && d.directors.length ? d.directors : f.directors) || [];
  const length = runtime ? fmtRuntime(runtime) + (runtime <= 40 ? ', court métrage' : '') : '';
  const meta = [d.year || f.year, length, directors.slice(0, 2).join(', ')].filter(Boolean).join(' — ');

  const head = el('div', 'film-head');
  paint(head, PALETTE[inkIndex(f.slug)]);
  head.append(
    el('span', 'stamp', 'Tirage N° ' + pad(entry.n)),
    el('h3', 'film-title narrow', d.name || f.name),
    el('p', 'film-meta', meta),
  );
  box.append(head);

  // Moyenne, nombre de notes, genres
  const rating = d.rating ?? f.rating;
  const count = d.ratingCount ?? f.ratingCount;
  const facts = el('dl', 'facts');
  const fact = (label, value, unit, cls) => {
    const div = el('div');
    const dd = el('dd', cls, value);
    if (unit) dd.append(el('span', null, unit));
    div.append(el('dt', null, label), dd);
    facts.append(div);
  };
  const waiting = loaded ? '—' : '…';
  fact('Moyenne Letterboxd', rating != null ? fmtRating(rating) : waiting, rating != null ? '/5' : null, rating != null ? '' : 'wait');
  fact('Notes', count != null ? num(count) : waiting, null, count != null ? '' : 'wait');
  fact('Genres', d.genres && d.genres.length ? d.genres.join(', ') : waiting, null, 'text');

  const rest = el('div', 'film-rest');
  const cols = el('div', 'film-cols');
  cols.append(el('p', 'synopsis', d.overview || ''), watchBlock(f, d, loaded));
  rest.append(facts, cols);
  box.append(rest);
  return box;
}

function leader(name, what, href, found) {
  const li = el('li', found ? 'found' : '');
  const a = el('a');
  a.href = href;
  a.target = '_blank';
  a.rel = 'noopener';
  a.append(el('span', 'name', name), el('span', 'dots'), el('span', 'what', what));
  li.append(a);
  return li;
}

function watchBlock(film, d, loaded) {
  const box = el('div', 'watch');
  box.append(el('h4', 'watch-title', 'Où le voir'));

  const w = d.watch;
  if (loaded && !w && !d.archive) box.append(el('p', 'watch-none', 'Aucune offre en Belgique ni en France.'));

  const list = el('ul', 'leaders');
  if (w && w.stream.length) list.append(leader(w.stream.join(', '), 'streaming, ' + w.country, w.link, true));
  if (w && w.rent.length) list.append(leader(w.rent.join(', '), 'location, ' + w.country, w.link, !w.stream.length));
  if (d.archive) list.append(leader('Internet Archive', 'libre de droits', d.archive, true));

  const name = d.name || film.name;
  const q = encodeURIComponent(name + ' ' + (d.year || film.year || ''));
  list.append(
    leader('YouTube', 'chercher', 'https://www.youtube.com/results?search_query=' + q),
    leader('Vimeo', 'chercher', 'https://vimeo.com/search?q=' + q),
    leader('Letterboxd', 'fiche', `https://letterboxd.com/film/${film.slug}/`),
  );
  if (d.tmdbId) list.append(leader('TMDB', 'fiche', `https://www.themoviedb.org/movie/${d.tmdbId}`));
  box.append(list);
  return box;
}

function renderHistory(kind) {
  const box = kind === 'gems' ? $('histGems') : $('histHasard');
  const hist = state.hist[kind];
  box.hidden = hist.length < 2;

  box.replaceChildren(document.createTextNode('Déjà tirés : '));
  [...hist].reverse().forEach((entry, i) => {

    const b = el('button', 'link' + (entry === state.current[kind] ? ' current' : ''), `${pad(entry.n)} ${entry.d ? entry.d.name : entry.film.name}`);
    b.type = 'button';
    b.addEventListener('click', () => show(kind, entry));
    box.append(b);
  });
}

// ---------- Duel ----------
// Le pool populaire vient de public/films.json, trié par nombre de notes.
// Difficulté d'un duel : écart de notes (échelle log), pondéré par l'âge des
// films (Letterboxd sous-estime les vieux titres) et par leur volume de notes.
const TIERS = {
  A: { label: 'Duel facile', min: 1.3, max: 4.0 },
  B: { label: 'Duel moyen', min: 0.42, max: 1.3 },
  C: { label: 'Duel difficile', min: 0, max: 0.42 },
};
const MIN_RATINGS = 3000;
const MIN_POOL = 6;
const MIN_RATIO = 1.04;
const MAX_RATIO = 12;
// Au moins un des deux films doit être identifiable
const PAIR_FLOOR = 120000;
// Le tirage penche vers le haut du classement
const BIAS = 1.8;
const NOW = new Date().getFullYear();
// Les motifs de difficulté se resserrent quand la série monte
const PATTERN_SETS = [
  { from: 0, patterns: ['ABBAC', 'BABCA', 'AABCC'] },
  { from: 50, patterns: ['BBACC', 'BABCB', 'CBBBC'] },
  { from: 100, patterns: ['CCCCA', 'BBCBB', 'CBCBC'] },
];
const RECORD_KEY = 'lb-duel-record';

const duel = {
  source: 'popular',
  popular: null,
  seen: null,
  pool: [],
  pair: null,
  revealed: false,
  loading: false,
  token: 0,
  recent: [],
  pattern: '',
  step: 0,
  streak: 0,
  best: 0,
};
try {
  duel.best = parseInt(localStorage.getItem(RECORD_KEY), 10) || 0;
} catch (e) {
  duel.best = 0;
}

const sortPool = list => list.sort((a, b) => b.ratingCount - a.ratingCount);

async function loadPopular() {
  if (!duel.popular) {
    const resp = await fetch('films.json');
    if (!resp.ok) throw new Error('Films populaires indisponibles.');
    duel.popular = sortPool((await resp.json()).filter(f => f.name && f.ratingCount >= MIN_RATINGS));
  }
  return duel.popular;
}

async function loadSeen() {
  if (!duel.seen) {
    const resp = await fetch(`${API_BASE}/api/seen/${encodeURIComponent(state.user)}`);
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error || 'Films vus indisponibles.');
    duel.seen = data.films || [];
  }
  return duel.seen;
}

function duelStatus(msg, error) {
  $('duelStatus').textContent = msg;
  $('duelStatus').classList.toggle('error', Boolean(error));
  $('duelStatus').hidden = !msg;
  $('duelGame').hidden = Boolean(msg);
}

async function setSource(src) {
  duel.source = src;
  const token = ++duel.token;
  duel.pair = null;
  duel.recent = [];
  duel.loading = true;
  for (const b of $('optSource').querySelectorAll('.opt')) b.setAttribute('aria-pressed', b.dataset.v === src);
  duelStatus(src === 'seen' ? 'Chargement des films vus…' : 'Chargement…');

  try {
    const popular = await loadPopular();
    if (token !== duel.token) return;
    if (src === 'popular') {
      duel.pool = popular.slice();
      duel.loading = false;
      duelStatus('');
      newDuel();
      return;
    }

    const films = src === 'seen' ? await loadSeen() : state.watchlist;
    if (token !== duel.token) return;
    if (!films.length) {
      duel.loading = false;
      duelStatus(src === 'seen' ? 'Aucun film vu trouvé.' : 'Watchlist vide.', true);
      return;
    }

    // Les films déjà dans le pool populaire ont leur nombre de notes : jouables
    // tout de suite. Les autres sont résolus pendant la partie.
    const known = new Map(popular.map(f => [f.slug, f]));
    const misses = [];
    duel.pool = [];
    for (const f of films) {
      const hit = known.get(f.slug);
      if (hit) duel.pool.push(hit);
      else misses.push(f.slug);
    }
    sortPool(duel.pool);

    if (duel.pool.length >= MIN_POOL) {
      duelStatus('');
      newDuel();
    } else {
      duelStatus('Lecture des films…');
    }
    topUp(misses, token);
  } catch (e) {
    if (token !== duel.token) return;
    duel.loading = false;
    duelStatus(e.message || 'Serveur injoignable.', true);
  }
}

async function topUp(slugs, token) {
  const queue = slugs.slice().sort(() => Math.random() - 0.5);

  for (let i = 0; i < queue.length && duel.pool.length < 120; i += 20) {
    if (token !== duel.token) return;
    try {
      const resp = await fetch(`${API_BASE}/api/films?slugs=${queue.slice(i, i + 20).map(encodeURIComponent).join(',')}`);
      if (!resp.ok) break;
      const { films } = await resp.json();
      if (token !== duel.token) return;

      for (const f of films) {
        if (f.ratingCount >= MIN_RATINGS) duel.pool.push(f);
      }
      sortPool(duel.pool);
      if (!duel.pair && duel.pool.length >= MIN_POOL) {
        duelStatus('');
        newDuel();
      }
    } catch (e) {
      break;
    }
  }

  if (token !== duel.token) return;
  duel.loading = false;
  if (duel.pool.length < 2) duelStatus('Pas assez de films pour un duel.', true);
  else if (!duel.pair) {
    duelStatus('');
    newDuel();
  }
}

function ratio(a, b) {
  const lo = Math.min(a.ratingCount, b.ratingCount);
  return lo ? Math.max(a.ratingCount, b.ratingCount) / lo : 0;
}
function ageWeight(a, b) {
  const age = f => NOW - (f.year || NOW - 15);
  return 1 - 0.5 * Math.min(1, ((age(a) + age(b)) / 2) / 60);
}
function magnitudeWeight(a, b) {
  const geo = Math.sqrt(a.ratingCount * b.ratingCount);
  return Math.max(0.45, Math.min(1, 0.45 + 0.55 * (Math.log10(geo) - 4) / 2.5));
}
function easiness(a, b) {
  const r = ratio(a, b);
  return r < MIN_RATIO ? 0 : Math.log2(r) * ageWeight(a, b) * magnitudeWeight(a, b);
}
function allowed(a, b) {
  const r = ratio(a, b);
  return r >= MIN_RATIO && r <= MAX_RATIO && Math.max(a.ratingCount, b.ratingCount) >= PAIR_FLOOR;
}
const pairKey = (a, b) => (a.slug < b.slug ? a.slug + '|' + b.slug : b.slug + '|' + a.slug);

function accept(a, b) {
  duel.recent.push(pairKey(a, b));
  if (duel.recent.length > 40) duel.recent.shift();
  return Math.random() < 0.5 ? [a, b] : [b, a];
}

function pickInTier(tier) {
  const band = TIERS[tier];
  const pool = duel.pool;
  for (let t = 0; t < 40; t++) {
    const a = pool[Math.floor(Math.pow(Math.random(), BIAS) * pool.length)];
    const cands = pool.filter(b => {
      if (b === a || !allowed(a, b)) return false;
      const e = easiness(a, b);
      return e >= band.min && e < band.max && !duel.recent.includes(pairKey(a, b));
    });
    if (cands.length) return accept(a, cands[Math.floor(Math.random() * cands.length)]);
  }
  return null;
}

function tierOf(e) {
  if (e >= TIERS.A.min) return 'A';
  if (e >= TIERS.B.min) return 'B';
  return 'C';
}

// Un petit pool ne permet pas toujours le palier demandé : on prend le plus
// proche, et en dernier recours n'importe quelle paire assez écartée.
function pickPair(tier) {
  const order = { A: 'ABC', B: 'BCA', C: 'CBA' }[tier];
  for (const t of order) {
    const pair = pickInTier(t);
    if (pair) return [pair, t];
  }
  const pool = duel.pool;
  for (let t = 0; t < 60; t++) {
    const a = pool[Math.floor(Math.random() * pool.length)];
    const b = pool[Math.floor(Math.random() * pool.length)];
    if (a !== b && ratio(a, b) >= MIN_RATIO) return [accept(a, b), tierOf(easiness(a, b))];
  }
  return [null, tier];
}

function nextTier() {
  if (duel.step >= duel.pattern.length) {
    let set = PATTERN_SETS[0].patterns;
    for (const s of PATTERN_SETS) if (duel.streak >= s.from) set = s.patterns;
    duel.pattern = set[Math.floor(Math.random() * set.length)];
    duel.step = 0;
  }
  return duel.pattern[duel.step++];
}

function newDuel() {
  const [pair, tier] = pickPair(nextTier());
  if (!pair) {
    duelStatus('Pas assez de films pour un duel.', true);
    return;
  }

  duel.pair = pair;
  duel.revealed = false;
  $('tier').textContent = TIERS[tier].label;

  // Deux encres différentes pour les deux films
  const ia = inkIndex(pair[0].slug);
  let ib = inkIndex(pair[1].slug);
  if (ib === ia) ib = (ib + 3) % PALETTE.length;

  const arena = $('arena');
  arena.classList.remove('revealed');
  arena.replaceChildren(side(pair[0], 0, PALETTE[ia]), el('span', 'or', 'ou'), side(pair[1], 1, PALETTE[ib]));

  $('verdict').className = 'verdict';
  $('verdict').replaceChildren();
  $('nextDuel').hidden = true;
  renderScore();
}

function side(film, i, ink) {
  const b = el('button', 'side');
  b.type = 'button';
  paint(b, ink);
  b.append(
    el('span', 'side-title narrow', film.name),
    el('span', 'side-year', film.year || ''),
    el('span', 'stamp stamp-pick', 'Ton choix'),
    el('span', 'stamp stamp-win', 'Le plus noté'),
  );

  const result = el('span', 'side-result');
  result.id = 'result' + i;
  result.append(el('span', 'n'), el('span', 'unit', 'notes'));
  b.append(result);

  b.addEventListener('click', () => vote(i));
  return b;
}

function vote(choice) {
  if (!duel.pair || duel.revealed) return;
  duel.revealed = true;

  const [a, b] = duel.pair;
  const win = a.ratingCount >= b.ratingCount ? 0 : 1;
  const ok = choice === win;

  const arena = $('arena');
  arena.classList.add('revealed');
  const sides = arena.querySelectorAll('.side');
  sides[win].classList.add('win');
  sides[1 - win].classList.add('lose');
  sides[choice].classList.add('picked');
  if (!ok) sides[choice].classList.add('wrong');
  duel.pair.forEach((f, k) => countUp($('result' + k).querySelector('.n'), f.ratingCount));

  // Série en cours, remise à zéro à la première erreur, et record
  duel.streak = ok ? duel.streak + 1 : 0;
  let record = false;
  if (duel.streak > duel.best) {
    duel.best = duel.streak;
    record = duel.streak > 1;
    try {
      localStorage.setItem(RECORD_KEY, String(duel.best));
    } catch (e) {
      // stockage refusé : le record reste en mémoire
    }
  }
  renderScore(record);

  const times = ratio(a, b).toFixed(1).replace('.', ',');
  const v = $('verdict');
  v.className = 'verdict ' + (ok ? 'ok' : 'ko');
  v.replaceChildren(
    el('strong', null, record ? 'Record.' : ok ? 'Bien vu.' : 'Raté.'),
    document.createTextNode(`${duel.pair[win].name} a ${times} fois plus de notes que ${duel.pair[1 - win].name}.`),
  );

  $('nextDuel').hidden = false;
  $('nextDuel').focus({ preventScroll: true });
  refresh();
}

// Valeur finale posée d'emblée : si l'onglet est en arrière-plan, les frames
// d'animation ne sont pas jouées et le compteur resterait vide.
function countUp(node, target) {
  node.textContent = num(target);
  if (reduced) return;

  const t0 = performance.now();
  function step(now) {
    const p = Math.min(1, (now - t0) / 650);
    node.textContent = num(Math.round(target * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderScore(record) {
  $('streak').textContent = duel.streak;
  $('best').textContent = duel.best;
  $('best').classList.toggle('up', Boolean(record));

  const lvl = duel.streak >= 100 ? 3 : duel.streak >= 50 ? 2 : 1;
  const left = (lvl === 1 ? 50 : 100) - duel.streak;
  $('levelText').textContent = lvl === 3 ? 'Niveau 3' : `Niveau ${lvl} · ${left} avant le niveau ${lvl + 1}`;
}

$('nextDuel').addEventListener('click', newDuel);

// ---------- Clavier : Espace tire un film, ← → votent, Entrée passe au duel suivant ----------
document.addEventListener('keydown', e => {
  const target = e.target instanceof Element ? e.target : document.body;
  if (target.matches('input, textarea')) return;
  const onButton = target.closest('button, a');

  if (state.tab === 'duel') {
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      vote(0);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      vote(1);
    } else if ((e.key === 'Enter' || e.key === ' ') && duel.revealed && !onButton) {
      e.preventDefault();
      newDuel();
    }
    return;
  }

  if (e.key === ' ' && !onButton) {
    e.preventDefault();
    draw(state.tab);
  }
});

// ---------- Démarrage ----------
renderProfile();
refresh();
renderScore();
loadGems().catch(() => {});
</script>
